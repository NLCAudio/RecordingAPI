apiVersion: 0.0.1
# auto picks avfoundation on macOS and dshow on Windows; set it explicitly to
# override. inputDevice is matched against the device names ffmpeg reports, so
# on Windows it matches every "DVS Receive N-M (Dante Virtual Soundcard)" pair.
framework: auto
inputDevice: "Dante Virtual Soundcard"
bitrate: 128k
# Windows only: how many milliseconds dshow buffers before handing audio to
# ffmpeg. Leave unset for the device default; raise it if recordings drop audio.
# audioBufferMs: 200
outputPath: ./recordings
logPath: ./recording_api.log
companionBaseUrl: http://127.0.0.1:8001/