apiVersion: 0.0.1
# auto picks avfoundation on macOS and dshow on Windows; set it explicitly to
# override. inputDevice is matched against the device names ffmpeg reports, so
# on Windows it matches every "DVS Receive N-M (Dante Virtual Soundcard)" pair.
framework: auto
inputDevice: "Dante Virtual Soundcard"
bitrate: 128k
# Windows only: how many milliseconds dshow buffers before handing audio to
# ffmpeg. Leave unset for the device default; raise it if recordings drop audio.
# audioBufferMs: 200
# Recordings are filed as <outputPath>/<room>/<service>/<file>.mp3; the folders
# are created on demand.
outputPath: ./recordings
# Where the server listens. 127.0.0.1 only accepts requests from this machine;
# set listenHost to 0.0.0.0 to accept them from other machines as well (on
# Windows that also needs an inbound firewall rule for the port). Changing
# either needs a restart of the server.
listenHost: 127.0.0.1
listenPort: 8000
# Set this when two servers report to the same Companion (e.g. "mac" on one and
# "windows" on the other). The status is then pushed to the custom variable
# recording_status_<serverName> instead of recording_status, so the two do not
# overwrite each other. Letters, digits and underscores only.
# serverName: mac
logPath: ./recording_api.log
# Every Companion instance the status is pushed to, one per line. Each gets its
# own push thread, so one machine being switched off does not slow the others.
companionBaseUrls:
  - http://127.0.0.1:8001/