[project]
name = "recording-api"
version = "0.1.0"
description = "HTTP API for controlling audio recordings via ffmpeg, with Bitfocus Companion integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.49",
    "pydantic>=2.0",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[tool.fastapi]
entrypoint = "main:app"
