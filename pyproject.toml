[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recording-api"
version = "0.1.0"
description = "HTTP API for controlling audio recordings via ffmpeg, with Bitfocus Companion integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.49",
    "pydantic>=2.0",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI TestClient transport
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Bug-catching lints only (unused imports/variables, undefined names, syntax).
# The broader style rule sets (line length, import order, type checks) are
# deliberately off: this codebase favours long explanatory comments and
# hand-tuned formatting over what a linter would impose.
select = ["F", "E9"]