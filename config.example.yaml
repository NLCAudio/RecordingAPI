# Recording API settings.
#
# The template: copy it to config.yaml, which is each machine's own and is not
# kept in the repository. config.py describes every setting in full.

# How the audio device is read. auto picks audioqueue on macOS and dshow on
# Windows, and is what you want.
framework: auto

# The audio device to record from. On Windows part of the name is enough, so
# this covers every "DVS Receive N-M (Dante Virtual Soundcard)" pair.
inputDevice: "Dante Virtual Soundcard"

# MP3 bitrate.
bitrate: 128k

# Milliseconds of audio the capture may hold before any is lost. Unset, Windows
# uses the device's own; raise it there if recordings drop audio. macOS always
# holds at least 2000 and logs "lost ... ms of audio" if that was not enough.
# audioBufferMs: 200

# Recordings are filed as <outputPath>/<room>/<service>/<file>.mp3; the folders
# are created on demand. Until it ends, a recording is kept in
# <outputPath>/.in-progress, so everything else there is a finished file.
outputPath: ./recordings
logPath: ./logs/recording_api.log

# Where the server listens. 127.0.0.1 only accepts requests from this machine;
# 0.0.0.0 accepts them from other machines too, as needed when Companion runs
# elsewhere (on Windows the port also needs an inbound firewall rule). A change
# needs a restart of the server.
listenHost: 127.0.0.1
listenPort: 8080

# The other machines that may use the API: addresses, or ranges such as
# 192.168.1.0/24. The API has no log-in, so set this whenever listenHost lets
# other machines in, normally to the machine Companion runs on. Other addresses
# are refused; this machine is always allowed. Left out, every address is
# accepted. A change needs a restart of the server.
# acceptRequestsFrom:
#   - 192.168.1.50

# For setting up: accept requests from every address, whatever the list above
# says. The log names each address the list would have refused, and warns every
# ten minutes for as long as this is on. A change needs a restart of the server.
# debugMode: true

# Set when two servers report to the same Companion ("mac" on one, "windows" on
# the other, say). The status then goes to the custom variable
# recording_status_<serverName> instead of recording_status, so they do not
# overwrite each other. Letters, digits and underscores only.
# serverName: mac

# Every Companion instance the status is pushed to, one per line.
companionBaseUrls:
  - http://127.0.0.1:8000/

# How many times a second the status is pushed.
# statusPushRefreshHz: 15
